services:
  docs:
    image: crown_crm_local_docs
    container_name: crown_crm_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./crown_crm:/app/crown_crm:z
    ports:
      - '9000:9000'
    command: /start-docs
