<!-- The client email form -->
<form
  hx-include="input#client_id"
  hx-post="{% url 'hx-clients-email-addresses' %}"
  hx-target="this"
>
  <div class="form-group row">
    <div class="col-sm-8">
      {{ form.email }}
      <!-- Form error handling. -->
      {% if form.email.errors %}
      <div class="invalid-feedback d-block">
        {% for error in form.email.errors %}
        <!-- error -->
        {{ error }}
        <!-- error -->
        {% endfor %}
      </div>
      {% endif %}
    </div>
    <div class="col-sm-4">
      <button type="Submit" class="btn btn-sm btn-success">Submit</button>
      <button
        type="Cancel"
        @click="console.log($event.target.parentNode.parentNode.parentNode.remove())"
        class="btn btn-sm btn-danger"
      >
        Cancel
      </button>
    </div>
  </div>
</form>
