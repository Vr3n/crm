<div class="table-responsive">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Description</th>
        <th>View</th>
        <th>Edit</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for member_type in member_types %}
      <tr id="member-type-{{ member_type.uuid }}">
        <td>{{ member_type.code }}</td>
        <td>{{ member_type.name }}</td>
        <td>{{ member_type.description }}</td>
        <td class="text-nowrap">
          <a href="{% url 'member-type-detail' slug=request.organization.slug uuid=member_type.uuid %}"
             class="btn btn-sm btn-primary">
            <i data-feather="eye" class="icon-sm"></i> View
          </a>
        </td>
        <td class="text-nowrap">
          <button class="btn btn-sm btn-info"
                  hx-get="{% url 'hx-edit-member-type' slug=request.organization.slug uuid=member_type.uuid %}"
                  hx-target="#modal-form">
            <i data-feather="edit" class="icon-sm"></i> Edit
          </button>
        </td>
        <td class="text-nowrap">
          <button hx-trigger="confirmed"
                  hx-target="#member-type-{{ member_type.uuid }}"
                  hx-swap="outerHTML"
                  onClick="Swal.fire({'icon': 'warning', title: 'Confirm', text:'Do you want to Delete?', 'showDenyButton': true, 'denyButtonText': 'No'}).then((result)=>{if(result.isConfirmed){htmx.trigger(this, 'confirmed');}})"
                  hx-delete="{% url 'hx-delete-member-type' slug=request.organization.slug uuid=member_type.uuid %}"
                  class="btn btn-sm btn-danger">
            <i data-feather="trash-2" class="icon-sm"></i> Delete
          </button>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="6" class="text-center py-3">No member types found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
