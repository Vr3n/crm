<div class="table-responsive">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Name</th>
        <th>Price</th>
        <td>Sales</td>
        <th>PT Sessions</th>
        <th>Status</th>
        <th>View</th>
        <th>Edit</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for plan in plans %}
        <tr id="membershipplan-{{ plan.uuid }}">
          <td>{{ plan.name }}</td>
          <td>₹{{ plan.price|floatformat:2 }}</td>
          <td>{{ plan.sales.count }}</td>
          <td>{{ plan.pt_sessions }}</td>
          <td>
            <span class="badge badge-{{ plan.is_active|yesno:'success,danger' }}">
              {{ plan.is_active|yesno:"Active,Inactive" }}
            </span>
          </td>
          <td class="text-nowrap">
            <a href="{% url 'membership-plan-detail' slug=request.organization.slug uuid=plan.uuid %}"
               class="btn btn-sm btn-primary">
              <i data-feather="eye" class="icon-sm"></i> View
            </a>
          </td>
          <td>
            <button class="btn btn-sm btn-info"
                    hx-get="{% url 'hx-edit-membership-plan' slug=request.organization.slug uuid=plan.uuid %}"
                    hx-target="#modal-form">
              <i data-feather="edit" class="icon-sm"></i> Edit
            </button>
          </td>
          <td>
            <button hx-trigger="confirmed"
                    hx-target="#membershipplan-{{ plan.uuid }}"
                    hx-swap="outerHTML"
                    onClick="Swal.fire({'icon': 'warning', title: 'Confirm', text:'Do you want to Delete?', 'showDenyButton': true, 'denyButtonText': 'No'}).then((result)=>{if(result.isConfirmed){htmx.trigger(this, 'confirmed');}})"
                    hx-delete="{% url 'hx-delete-membership-plan' slug=request.organization.slug uuid=plan.uuid %}"
                    class="btn btn-sm btn-danger">
              <i data-feather="trash-2" class="icon-sm"></i> Delete
            </button>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="8" class="text-center py-3">No membership plans found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
