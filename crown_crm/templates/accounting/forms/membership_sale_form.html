{% extends "base.html" %}
{% load static %}
{% block title %}
  New Membership Sale - {{ block.super }}
{% endblock title %}
{% block content %}
  <h4 class="mb-3">Membership Sale</h4>
  {% include "accounting/partials/membership_sale_form.html" %}
{% endblock content %}
{% block custom_js %}
  <script>
    /* ===================== LEAD SELECTION ==================== */
    function selected_lead_card(leadName, leadId, mobileNumbers, emails) {
      return `
      <div class="card border-info mb-3">
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center py-2 px-3">
          <div class="d-flex align-items-center">
            <i class="feather icon-user me-2 text-white-50"></i>
            <h6 class="card-title mb-0 text-white fw-normal">${leadName}</h6>
          </div>
          <button type="button" class="btn btn-xs btn-outline-light border-0 p-1" onclick="${() => removeSelectedLead()}" title="Remove lead">
            <i class="feather icon-x" style="font-size: 0.9rem; line-height: 1;"></i>
          </button>
        </div>
        <div class="card-body p-3">
          <div class="row g-3">
            <div class="col-6">
              <div class="border-end h-100 d-flex flex-column justify-content-center">
                <div class="text-muted small mb-1">
                  <i class="feather icon-phone me-1"></i> Contact
                </div>
                <div class="fw-bold">${mobileNumbers || 'N/A'}</div>
              </div>
            </div>
            <div class="col-6">
              <div class="h-100 d-flex flex-column justify-content-center">
                <div class="text-muted small mb-1">
                  <i class="feather icon-mail me-1"></i> Email
                </div>
                <div class="fw-bold text-truncate">${emails || 'N/A'}</div>
              </div>
            </div>
          </div>
          <input type="hidden" name="lead" value="${leadId}">
        </div>
      </div>`;
    }

    
    /**
    * Handles the selection of a lead from search results
    * @param {HTMLElement} card - The card element that was clicked, containing lead data attributes
    * @returns {void}
    * @description
    * - Extracts lead information from the card's data attributes
    * - Updates the lead selection UI with the selected lead's information
    * - Clears the search results container
    */
    function selectLead(card) {
      const leadId = card.dataset.leadId;
      const leadName = card.dataset.leadName;
      const mobileNumbers = JSON.parse(card.dataset.leadMobileNumbers);
      const emails = JSON.parse(card.dataset.leadEmails);
      const selectionDiv = document.getElementById('leadSelection');
      const leadInput = document.getElementById('lead');
      leadInput.value = leadId;

      // Render selected lead summary
      selectionDiv.innerHTML = selected_lead_card(leadName, leadId, mobileNumbers, emails);

      // Clear search results
      const results = document.getElementById('leadSearchResults');
      if (results) {
        results.innerHTML = '';
      }
    };

    /**
    * Removes the currently selected lead from the UI
    * @returns {void}
    * @description
    * - Clears the lead selection area by setting its innerHTML to an empty string
    * - Safe to call even if the selection div doesn't exist
    */
    function removeSelectedLead() {
      const selectionDiv = document.getElementById('leadSelection');
      const leadInput = document.getElementById('lead');
      leadInput.value = '';
      if (selectionDiv) {
        selectionDiv.innerHTML = '';
      }
    };

    /**
    * Handles the lead creation success event
    * @param {CustomEvent} evt - The custom event containing lead data in evt.detail
    * @returns {void}
    * @description
    * - Processes newly created lead data from the event
    * - Updates the UI to show the newly created lead
    * - Clears search input and results
    * - Hides the modal dialog
    */
    document.body.addEventListener('lead_create_success', function(evt) {
      const leadData = evt.detail;
      const leadId = leadData.id; // model_to_dict serializes pk as 'id'
      const leadName = [leadData.first_name, leadData.middle_name, leadData.last_name].filter(Boolean).join(' ');
      const selectionDiv = document.getElementById('leadSelection');
      const mobileNumbers = leadData.mobile_numbers || [];
      const emails = leadData.emails || [];

      // Render the newly created lead in the selection area
      selectionDiv.innerHTML = selected_lead_card(leadName, leadId, mobileNumbers, emails);

      // Clear the search input and results
      const leadSearch = document.getElementById('leadSearch');
      const leadSearchResults = document.getElementById('leadSearchResults');
      if (leadSearch) leadSearch.value = '';
      if (leadSearchResults) leadSearchResults.innerHTML = '';

      // Hide the modal (assumes Bootstrap 4.6 with jQuery)
      const modal = document.getElementById('modal-container');
      if (modal) {
        $(modal).modal('hide');
      }
    });

    // ===================== MEMBERSHIP PLAN SELECTION ====================
    /**
    * Generates HTML markup for displaying a selected membership plan card
    * @param {string} planName - The name of the membership plan
    * @param {number|string} planPrice - The price of the plan
    * @param {number|string} ptSessions - Number of personal training sessions included
    * @param {number|string} dietPlans - Number of diet plans included
    * @param {string} planId - The unique identifier for the plan
    * @returns {string} HTML markup for the membership plan card
    * @description
    * - Creates a responsive card displaying plan details
    * - Includes price, PT sessions, and diet plans information
    * - Provides a remove button to deselect the plan
    */
    function selected_membership_card(planName, planPrice, ptSessions, dietPlans, planId) {
      return `
      <div class="card border-success mb-3">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center py-2 px-3">
          <div class="d-flex align-items-center">
            <i class="feather icon-check-circle me-2 text-white-50"></i>
            <h6 class="card-title mb-0 text-white fw-normal">${String(planName || '')}</h6>
          </div>
          <button type="button" class="btn btn-xs btn-outline-light border-0 p-1" onclick="removeSelectedMembershipPlan()" title="Remove plan">
            <i class="feather icon-x" style="font-size: 0.9rem; line-height: 1;"></i>
          </button>
        </div>
        <div class="card-body p-3">
          <div class="row g-3 text-center">
            <div class="col-4">
              <div class="border-end h-100 d-flex flex-column justify-content-center">
                <div class="text-muted small mb-1">
                  <i class="feather icon-tag me-1"></i> Price
                </div>
                <div class="fw-bold">₹${Number(planPrice || 0).toFixed(2)}</div>
              </div>
            </div>
            
            <div class="col-4">
              <div class="border-end h-100 d-flex flex-column justify-content-center">
                <div class="text-muted small mb-1">
                  <i class="feather icon-activity me-1"></i> PT Sessions
                </div>
                <div class="fw-bold">${ptSessions || 'None'}</div>
              </div>
            </div>
            
            <div class="col-4">
              <div class="h-100 d-flex flex-column justify-content-center">
                <div class="text-muted small mb-1">
                  <i class="feather icon-pie-chart me-1"></i> Diet Plans
                </div>
                <div class="fw-bold">${dietPlans || 'None'}</div>
              </div>
            </div>
          </div>
          <input type="hidden" name="plan" value="${String(planId || '')}">
        </div>
      </div>`;
    }

    /**
    * Handles the selection of a membership plan from search results
    * @param {HTMLElement} card - The card element that was clicked, containing plan data attributes
    * @returns {void}
    * @description
    * - Extracts plan information from the card's data attributes
    * - Updates the UI to show the selected plan details
    * - Initializes customization form with plan defaults
    * - Updates payment information
    * - Clears the search results
    */
    function selectMembershipPlan(card) {
      if (!card || !card.dataset) {
        console.error('Invalid card element provided');
        return;
      }

      const planId = card.dataset.planId || '';
      const planName = card.dataset.planName || '';
      const planPrice = parseFloat(card.dataset.planPrice) || 0;
      const ptSessions = parseInt(card.dataset.planPtSessions, 10) || 0;
      const dietPlans = parseInt(card.dataset.planDietPlans, 10) || 0;
      const planInput = document.getElementById('plan');
      planInput.value = planId;
      
      const selectionDiv = document.getElementById('membershipPlanSelection');
      const customizationSection = document.getElementById('customizationSection');

      if (!selectionDiv) {
        console.error('Could not find membership plan selection container');
        return;
      }

      // Render selected plan summary
      selectionDiv.innerHTML = selected_membership_card(planName, planPrice, ptSessions, dietPlans, planId);

      // Initialize customization section with plan defaults
      const customPrice = Number(planPrice || 0);
      const decidedAmountInput = document.getElementById('decidedAmount');
      const customPriceInput = document.getElementById('customPrice');
      const customPtSessionsInput = document.getElementById('customPtSessions');
      const customDietPlansInput = document.getElementById('customDietPlans');
      const durationInput = document.getElementById('duration');
      const payment_amount = document.getElementById('payment_amount');

      if (decidedAmountInput) decidedAmountInput.value = customPrice.toFixed(0);
      if (customPriceInput) customPriceInput.value = customPrice.toFixed(0);
      if (customPtSessionsInput) customPtSessionsInput.value = ptSessions;
      if (customDietPlansInput) customDietPlansInput.value = dietPlans;
      if (durationInput) durationInput.value = 'yearly';
      if (payment_amount) payment_amount.value = customPrice.toFixed(0);
      
      // Initialize payment section with the new price
      if (typeof updatePaymentAmount === 'function') {
        updatePaymentAmount();
      }

      // Show customization section if it exists
      if (customizationSection) {
        customizationSection.style.display = 'block';
      }

      // Clear input and search results
      const searchInput = document.getElementById('membershipPlanSearch');
      const searchResults = document.getElementById('membershipPlanSearchResults');
      if (searchInput) searchInput.value = '';
      if (searchResults) searchResults.innerHTML = '';
    };

    /**
    * Handles the membership plan creation success event
    * @param {CustomEvent} evt - The custom event containing plan data in evt.detail
    * @returns {void}
    * @description
    * - Processes newly created plan data from the event
    * - Updates the UI to show the newly created plan
    * - Initializes customization form with plan defaults
    * - Updates payment information
    * - Clears search input and results
    * - Hides the modal dialog
    */
    document.body.addEventListener('membership_plan_create_success', function(evt) {
      const plan = evt.detail;
      
      if (!plan || !plan.id) {
        console.error('Invalid plan data received:', plan);
        return;
      }
      
      const selectionDiv = document.getElementById('membershipPlanSelection');
      const customizationSection = document.getElementById('customizationSection');
      
      if (!selectionDiv || !customizationSection) {
        console.error('Required elements not found');
        return;
      }
      
      const planPrice = Number(plan.price || 0);
      const ptSessions = parseInt(plan.pt_sessions, 10) || 0;
      const dietPlans = parseInt(plan.diet_plans, 10) || 0;
      const planName = String(plan.name || 'New Plan');
      const planId = String(plan.id || plan.pk || '');
      
      // Update the selected plan card
      selectionDiv.innerHTML = selected_membership_card(
        planName,
        planPrice,
        ptSessions,
        dietPlans,
        planId
      );
      
      // Initialize customization section with plan defaults
      const priceStr = planPrice.toFixed(2);
      const decidedAmountInput = document.getElementById('decidedAmount');
      const customPriceInput = document.getElementById('customPrice');
      const customPtSessionsInput = document.getElementById('customPtSessions');
      const customDietPlansInput = document.getElementById('customDietPlans');
      const durationInput = document.getElementById('duration');
      const payment_amount = document.getElementById('payment_amount');

      if (decidedAmountInput) decidedAmountInput.value = priceStr;
      if (customPriceInput) customPriceInput.value = priceStr;
      if (customPtSessionsInput) customPtSessionsInput.value = ptSessions;
      if (customDietPlansInput) customDietPlansInput.value = dietPlans;
      if (durationInput) durationInput.value = 'yearly';
      if (payment_amount) payment_amount.value = priceStr;
      
      // Show customization section and update payment
      customizationSection.style.display = 'block';
      
      if (typeof updatePaymentAmount === 'function') {
        updatePaymentAmount();
      }
      
      // Clear search and close modal
      const searchInput = document.getElementById('membershipPlanSearch');
      const searchResults = document.getElementById('membershipPlanSearchResults');
      if (searchInput) searchInput.value = '';
      if (searchResults) searchResults.innerHTML = '';
      
      const modal = document.getElementById('modal-container');
      if (modal && typeof $(modal).modal === 'function') {
        $(modal).modal('hide');
      }
    });

    /**
    * Initializes the payment section with default values
    * @returns {void}
    * @description
    * - Sets initial values for payment amount and balance
    * - Safe to call multiple times
    */
    function initPaymentSection() {
      const paymentAmount = document.getElementById('paymentAmount');
      const balanceAmount = document.getElementById('balanceAmount');
      
      if (paymentAmount) {
        paymentAmount.value = 0;
        paymentAmount.max = 0;
      }
      
      if (balanceAmount) {
        balanceAmount.textContent = 0;
      }
    };

    /**
    * Updates the payment amount field based on the custom price
    * @returns {void}
    * @description
    * - Syncs the payment amount with the custom price
    * - Ensures payment amount doesn't exceed the custom price
    * - Updates the balance after making changes
    */
    function updatePaymentAmount() {
      const customPriceInput = document.getElementById('custom_price');
      const paymentAmount = document.getElementById('payment_amount');
      
      if (!customPriceInput || !paymentAmount) {
        return;
      }
      
      const customPrice = Number(customPriceInput.value) || 0;
      paymentAmount.max = customPrice;
      
      // Only update the payment amount if it's empty or exceeds the new max
      if (!paymentAmount.value || Number(paymentAmount.value) > customPrice) {
        paymentAmount.value = customPrice > 0 ? Math.floor(customPrice) : 0;
      }
      
      updateBalance();
    };

    /**
    * Updates the balance amount based on custom price and payment amount
    * @returns {void}
    * @description
    * - Calculates the remaining balance
    * - Updates the balance display
    * - Toggles validation classes based on payment amount
    */
    function updateBalance() {
      const customPriceInput = document.getElementById('customPrice');
      const paymentAmountInput = document.getElementById('payment_amount');
      const balanceAmount = document.getElementById('balanceAmount');
      
      if (!customPriceInput || !paymentAmountInput || !balanceAmount) {
        return;
      }
      
      const customPrice = customPriceInput.value || 0;
      const paymentAmount = paymentAmountInput.value || 0;
      const balance = Math.max(0, customPrice - paymentAmount);

      balanceAmount.innerHTML = balance.toFixed(0);
      
      // Toggle invalid class based on payment amount
      if (paymentAmount > customPrice) {
        paymentAmountInput.classList.add('is-invalid');
      } else {
        paymentAmountInput.classList.remove('is-invalid');
      }
    };

    // Set today's date as default for membership start date
    function setDefaultStartDate() {
      const startDateInput = document.getElementById('id_membership_start_date');
      if (startDateInput && !startDateInput.value) {
        startDateInput.value = new Date().toISOString().split('T')[0];
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      initPaymentSection();
      setDefaultStartDate();
      
      // Event listeners for price and payment inputs
      const customPriceInput = document.getElementById('customPrice');
      const paymentAmountInput = document.getElementById('payment_amount');
      
      if (customPriceInput) {
        customPriceInput.addEventListener('input', updatePaymentAmount);
      }
      
      if (paymentAmountInput) {
        paymentAmountInput.addEventListener('input', updateBalance);
        
        paymentAmountInput.addEventListener('change', function() {
          if (!customPriceInput) return;
          
          const customPrice = Number(customPriceInput.value) || 0;
          const paymentAmount = Number(paymentAmountInput.value) || 0;
          
          if (paymentAmount > customPrice) {
            paymentAmountInput.value = Math.floor(customPrice);
            updateBalance();
          }
        });
      }
    });

    /**
    * Handles the custom price input to calculate and display discount
    * @param {Event} event - The input event
    * @returns {void}
    * @description
    * - Calculates discount percentage when custom price is less than decided amount
    * - Updates the discount display
    * - Provides visual feedback for discounted price
    */
    function handleCustomPriceInput(event) {
      const decidedAmountInput = document.getElementById('decidedAmount');
      const discountInfo = document.getElementById('discountInfo');
      const discountPercentage = document.getElementById('discountPercentage');
      
      if (!decidedAmountInput || !discountInfo || !discountPercentage) {
        return;
      }
      
      const decidedAmount = Number(decidedAmountInput.value) || 0;
      const customPrice = Number(event.target.value) || 0;
      
      if (customPrice < decidedAmount && decidedAmount > 0) {
        const discount = ((decidedAmount - customPrice) / decidedAmount) * 100;
        discountPercentage.textContent = Math.round(discount);
        discountInfo.style.display = 'block';
        
        // Visual feedback for discount
        event.target.classList.add('is-valid');
      } else {
        discountInfo.style.display = 'none';
        event.target.classList.remove('is-valid');
      }
    };
    
    // Add event listener for custom price input
    const customPriceInput = document.getElementById('customPrice');
    if (customPriceInput) {
      customPriceInput.addEventListener('input', handleCustomPriceInput);
    }

    /**
    * Removes the selected membership plan and resets related UI elements
    * @returns {void}
    * @description
    * - Clears the membership plan selection
    * - Hides the customization section
    * - Clears the membership plan search input
    * - Resets the payment section
    */
    function removeSelectedMembershipPlan() {
      const selectionDiv = document.getElementById('membershipPlanSelection');
      const customizationSection = document.getElementById('customizationSection');
      const searchInput = document.getElementById('membershipPlanSearch');
      const planInput = document.getElementById('plan');
      
      if (selectionDiv) selectionDiv.innerHTML = '';
      if (customizationSection) customizationSection.style.display = 'none';
      if (searchInput) searchInput.value = '';
      if (planInput) planInput.value = '';
      
      // Reset payment section
      initPaymentSection();
    };


  </script>
{% endblock custom_js %}
