{% extends 'base.html' %}
<!-- -->
{% block content %}
<h2>Leads</h2>

<button
  class="btn btn-primary my-2"
  type="button"
  data-toggle="collapse"
  data-target="#collapseExample"
  aria-expanded="false"
  aria-controls="collapseExample"
>
  Add new Lead
</button>

<div class="collapse" id="collapseExample">
  <div
    class="card card-body"
    hx-trigger="revealed"
    hx-get="{% url 'hx-create-lead' slug=request.organization.slug %}"
    hx-swap="innerHTML"
    hx-target="this"
    id="create-form"
  ></div>
</div>

<div class="row mb-4">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h6 class="text-primary mb-2">Leads without Membership</h6>
        <div class="table-responsive-sm">
          <div class="table-container"
               id="leads-without-membership-table"
               hx-get="{% url 'hx-leads-without-membership-table' slug=request.organization.slug %}"
               hx-trigger="load"
               hx-swap="outerHTML">
            <div class="text-center py-3">
              <span class="spinner-border spinner-border-sm"></span> Loading...
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h6 class="text-primary mb-2">Leads with Membership</h6>
        <div class="table-responsive-sm">
          <div class="table-container"
               id="leads-with-membership-table"
               hx-get="{% url 'hx-leads-with-membership-table' slug=request.organization.slug %}"
               hx-trigger="load"
               hx-swap="outerHTML">
            <div class="text-center py-3">
              <span class="spinner-border spinner-border-sm"></span> Loading...
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-lg-12 col-xl-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-baseline mb-2">
          <h6 class="card-title mb-0">All Leads</h6>
          <div class="dropdown mb-2">
            <button
              class="btn p-0"
              type="button"
              id="dropdownMenuButton7"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <i
                class="icon-lg text-muted pb-3px"
                data-feather="more-horizontal"
              ></i>
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton7">
              <a class="dropdown-item d-flex align-items-center" href="#">
                <i data-feather="eye" class="icon-sm mr-2"></i>
                <span>View</span>
              </a>
              <a class="dropdown-item d-flex align-items-center" href="#">
                <i data-feather="edit-2" class="icon-sm mr-2"></i>
                <span>Edit</span>
              </a>
              <a class="dropdown-item d-flex align-items-center" href="#">
                <i data-feather="trash" class="icon-sm mr-2"></i>
                <span>Delete</span>
              </a>
              <a class="dropdown-item d-flex align-items-center" href="#">
                <i data-feather="printer" class="icon-sm mr-2"></i>
                <span>Print</span>
              </a>
              <a class="dropdown-item d-flex align-items-center" href="#">
                <i data-feather="download" class="icon-sm mr-2"></i>
                <span>Download</span>
              </a>
            </div>
          </div>
        </div>
        <div
          class="table-responsive"
          hx-trigger="load, lead-created from:body, lead-updated from:body, lead-deleted from:body"
          hx-swap="innerHTML"
          hx-get="{% url 'hx-leads-table' slug=request.organization.slug %}?per_page=25"
          hx-target="#all-leads-table"
          id="all-leads-table"
        >
          <p>Loading the leads... Please Wait!</p>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- row -->
{% endblock content %}

<!-- custom js for the page. -->
{% block custom_js %}
<script>
  document.body.addEventListener("lead-created", function (event) {
    $("#collapseExample").collapse("hide");
    document.getElementById("lead-create-form-partial").reset();
  });
</script>
{% endblock custom_js %}
