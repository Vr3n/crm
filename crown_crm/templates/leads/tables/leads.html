<table id="lead_table" class="table table-hover mb-0">
  <thead>
    <tr>
      <th class="pt-0">Name</th>
      <th class="pt-0">Mobile Number</th>
      <th class="pt-0">Email Address</th>
      <th class=""></th>
      <th class=""></th>
    </tr>
  </thead>
  <tbody>
    {% for lead in leads %}
      <tr>
        <td>{{ lead.full_name }}</td>
        <td>{{ lead.mobile_numbers.first.mobile_number|default_if_none:"Not Provided" }}</td>
        <td>{{ lead.emails.first.email|default_if_none:"Not Provided" }}</td>
        <td>
          <a href="{% url 'lead-detail' slug=request.organization.slug pk=lead.pk %}"
             class="btn btn-sm btn-primary">Detail</a>
        </td>
        <td>
          <a hx-trigger="confirmed"
             hx-target="#lead_table"
             hx-swap="outerHTML"
             onClick="Swal.fire({'icon': 'warning', title: 'Confirm', text:'Do you want to Delete?', 'showDenyButton': true, 'denyButtonText': 'No'}).then((result)=>{ if(result.isConfirmed){ htmx.trigger(this, 'confirmed'); } })"
             hx-delete="{% url 'hx-delete-lead' slug=request.organization.slug pk=lead.pk %}"
             class="btn btn-sm btn-danger">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="4">No leads added.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
