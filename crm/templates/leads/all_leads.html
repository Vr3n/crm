{% extends 'base.html' %}
<!-- -->
{% block content %}
<h2>Leads</h2>

<button
  class="btn btn-primary my-2"
  type="button"
  data-toggle="collapse"
  data-target="#collapseExample"
  aria-expanded="false"
  aria-controls="collapseExample"
>
  Add new Lead
</button>

<div class="collapse" id="collapseExample">
  <div
    class="card card-body"
    hx-trigger="revealed"
    hx-get="{% url 'hx-create-lead' %}"
    hx-swap="innerHTML"
    hx-target="this"
    id="create-form"
  ></div>
</div>

<div class="row">
  <div class="col-lg-12 col-xl-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-baseline mb-2">
          <h6 class="card-title mb-0">Leads</h6>
          <div class="dropdown mb-2">
            <button
              class="btn p-0"
              type="button"
              id="dropdownMenuButton7"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <i
                class="icon-lg text-muted pb-3px"
                data-feather="more-horizontal"
              ></i>
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton7">
              <a class="dropdown-item d-flex align-items-center" href="#"
                ><i data-feather="eye" class="icon-sm mr-2"></i>
                <span class="">View</span></a
              >
              <a class="dropdown-item d-flex align-items-center" href="#"
                ><i data-feather="edit-2" class="icon-sm mr-2"></i>
                <span class="">Edit</span></a
              >
              <a class="dropdown-item d-flex align-items-center" href="#"
                ><i data-feather="trash" class="icon-sm mr-2"></i>
                <span class="">Delete</span></a
              >
              <a class="dropdown-item d-flex align-items-center" href="#"
                ><i data-feather="printer" class="icon-sm mr-2"></i>
                <span class="">Print</span></a
              >
              <a class="dropdown-item d-flex align-items-center" href="#"
                ><i data-feather="download" class="icon-sm mr-2"></i>
                <span class="">Download</span></a
              >
            </div>
          </div>
        </div>
        <div
          class="table-responsive"
          hx-trigger="lead_create_success from:body"
          hx-swap="innerHTML"
          hx-get="{% url 'hx-leads-table' %}"
          id="all-leads-table"
        >
          {% include 'leads/tables/leads.html' %}
        </div>
      </div>
    </div>
  </div>
</div>
<!-- row -->
{% endblock content %}

<!-- custom js for the page. -->
{% block custom_js %}
<script>
  document.body.addEventListener("lead_create_success", function (event) {
    $("#collapseExample").collapse("hide");
    document.getElementById("lead-create-form-partial").reset();
  });
</script>
{% endblock custom_js %}
